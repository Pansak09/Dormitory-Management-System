<form hx-post="{% url 'room_edit' r.id %}"
      hx-target="#room-detail" hx-swap="innerHTML" class="space-y-3">
  {% csrf_token %}
  {{ form.dorm }}
  <div>
    <label class="block text-sm mb-1">เลขห้อง</label>
    {{ form.room_number }}
  </div>
  <p class="rounded-lg bg-blue-50 px-3 py-2 text-sm text-blue-800">การกำหนดบัญชีผู้เช่า ให้จัดการจากเมนู “จัดการผู้เช่า”</p>
  <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
    <div>
      <label class="block text-sm mb-1">ชั้น</label>
      {{ form.floor }}
    </div>
    <div>
      <label class="block text-sm mb-1">ราคา/เดือน</label>
      {{ form.price_per_month }}
    </div>
    <div>
      <label class="block text-sm mb-1">สถานะ</label>
      {{ form.status }}
    </div>
  </div>

  <div>
    <label class="block text-sm font-semibold mb-1">ข้อมูลผู้เช่า</label>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <div>
        <label class="block text-sm mb-1">ชื่อผู้เช่า</label>
        {{ form.tenant_name }}
      </div>
      <div>
        <label class="block text-sm mb-1">เบอร์โทร</label>
        {{ form.tenant_phone }}
      </div>
    </div>
    <div class="mt-2">
      <label class="block text-sm mb-1">ที่อยู่</label>
      {{ form.tenant_address }}
    </div>
  </div>

  <div class="flex gap-2 pt-2">
    <button class="px-4 py-2 bg-blue-600 text-white rounded">บันทึก</button>
    <a hx-get="{% url 'room_detail_partial' r.id %}"
       hx-target="#room-detail" hx-swap="innerHTML"
       class="px-4 py-2 border rounded cursor-pointer">ยกเลิก</a>
  </div>
</form>
