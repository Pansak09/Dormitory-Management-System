<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{% block title %}Dormitory System{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>

  <!-- Flatpickr สำหรับ Datepicker -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

  <script>
    // CSRF Token สำหรับ HTMX
    document.addEventListener('htmx:configRequest', (evt) => {
      const csrftoken = document.querySelector('[name=csrfmiddlewaretoken]')?.value;
      if (csrftoken) evt.detail.headers['X-CSRFToken'] = csrftoken;
    });

    // ฟังก์ชัน init datepickers
    function initDatePickers(scope) {
      const root = scope || document;
      const ids = ["id_booking_date", "id_move_in_date"];
      ids.forEach((id) => {
        const el = root.getElementById(id);
        if (el && !el._flatpickr) {
          flatpickr(el, {
            dateFormat: "Y-m-d",
            allowInput: true,
          });
        }
      });
    }

    // โหลดครั้งแรก
    document.addEventListener("DOMContentLoaded", () => initDatePickers());

    // โหลดใหม่ทุกครั้งหลัง HTMX swap
    document.body.addEventListener("htmx:afterSwap", (ev) => {
      const target = ev.target || document;
      initDatePickers(target);
    });
  </script>
</head>
<body class="bg-gray-50 min-h-screen">
  <form class="hidden">{% csrf_token %}</form>

  <!-- Navbar -->
  <nav class="bg-white shadow sticky top-0 z-10">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between">
      <a href="/" class="font-bold">Dormitory</a>
      <div class="space-x-4">
        {% if user.is_authenticated %}
          <a href="{% url 'dorm_list' %}" class="hover:underline">Home</a>
          {# ✅ โชว์ Dashboard เฉพาะ staff/superuser #}
          {% if user.is_staff or user.is_superuser %}
            <a href="{% url 'dashboard' %}" class="hover:underline">Dashboard</a>
          {% endif %}
          <span>{{ user.username }}</span>
          <a href="/logout/" class="text-red-600 hover:underline">Logout</a>
        {% else %}
          <a href="/login/" class="hover:underline">Login</a>
          <a href="{% url 'signup' %}" class="hover:underline">Sign up</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="max-w-6xl mx-auto p-6">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
