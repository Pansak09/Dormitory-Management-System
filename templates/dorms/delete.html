{% extends "base.html" %}
{% block title %}ลบหอพัก{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold text-red-600 mb-4">ลบหอพัก</h1>

<p class="mb-6">คุณแน่ใจหรือไม่ว่าต้องการลบ <strong>{{ dorm.name }}</strong> ?  
การลบนี้ไม่สามารถย้อนกลับได้</p>

<form method="post" class="flex gap-3">
  {% csrf_token %}
  <button type="submit"
          class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded">
    ยืนยันลบ
  </button>
  <a href="{% url 'dorm_detail' dorm.id %}"
     class="px-4 py-2 border rounded">
    ยกเลิก
  </a>
</form>
{% endblock %}
